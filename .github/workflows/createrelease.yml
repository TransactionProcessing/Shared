name: Release

on:
  release:
    types: [published]

jobs:
  build:
    name: "Release"
    env:
        ASPNETCORE_ENVIRONMENT: "Production"

    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
    steps:
    - uses: actions/checkout@v1

    - name: Get the version 
      id: get_version
      run: echo ::set-output name=VERSION::${GITHUB_REF/refs\/tags\//}

    - name: Install .NET 11 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 11.0.x

    - name: Restore Nuget Packages
      run: dotnet restore TransactionProcessing.sln --source ${{ secrets.PUBLICFEEDURL }} --source ${{ secrets.PRIVATEFEED_URL }}

    - name: Build Code
      run: dotnet build TransactionProcessing.sln --configuration Release

    - name: Trust root certificate
      run: |
        sudo cp ./TransactionProcessing.Shared.EventStoreContext.Tests/certs/ca/ca.crt /usr/local/share/ca-certificates/ca.crt
        sudo update-ca-certificates
        
    - name: Build Nuget Packages
      run: |
        dotnet pack "TransactionProcessing.Shared\TransactionProcessing.Shared.csproj" /p:PackageVersion=${{ steps.get_version.outputs.VERSION }} --output Nugets
        dotnet nuget push Nugets/TransactionProcessing.Shared.${{ steps.get_version.outputs.VERSION }}.nupkg --api-key ${{ secrets.PRIVATEFEED_APIKEY }} --source ${{ secrets.PRIVATEFEED_URL }}

        dotnet pack "TransactionProcessing.Shared.Logger\TransactionProcessing.Shared.Logger.csproj" /p:PackageVersion=${{ steps.get_version.outputs.VERSION }} --output Nugets
        dotnet nuget push Nugets/TransactionProcessing.Shared.Logger.${{ steps.get_version.outputs.VERSION }}.nupkg --api-key ${{ secrets.PRIVATEFEED_APIKEY }} --source ${{ secrets.PRIVATEFEED_URL }}
        
        dotnet pack "TransactionProcessing.Shared.DomainDrivenDesign\TransactionProcessing.Shared.DomainDrivenDesign.csproj" /p:PackageVersion=${{ steps.get_version.outputs.VERSION }} --output Nugets
        dotnet nuget push Nugets/TransactionProcessing.Shared.DomainDrivenDesign.${{ steps.get_version.outputs.VERSION }}.nupkg --api-key ${{ secrets.PRIVATEFEED_APIKEY }} --source ${{ secrets.PRIVATEFEED_URL }}

        dotnet pack "TransactionProcessing.Shared.EventStore\TransactionProcessing.Shared.EventStore.csproj" /p:PackageVersion=${{ steps.get_version.outputs.VERSION }} --output Nugets
        dotnet nuget push Nugets/TransactionProcessing.Shared.EventStore.${{ steps.get_version.outputs.VERSION }}.nupkg --api-key ${{ secrets.PRIVATEFEED_APIKEY }} --source ${{ secrets.PRIVATEFEED_URL }}

        dotnet pack "TransactionProcessing.ClientProxyBase\TransactionProcessing.ClientProxyBase.csproj" /p:PackageVersion=${{ steps.get_version.outputs.VERSION }} --output Nugets
        dotnet nuget push Nugets/TransactionProcessing.ClientProxyBase.${{ steps.get_version.outputs.VERSION }}.nupkg --api-key ${{ secrets.PRIVATEFEED_APIKEY }} --source ${{ secrets.PRIVATEFEED_URL }}

        dotnet pack "TransactionProcessing.Shared.IntegrationTesting\TransactionProcessing.Shared.IntegrationTesting.csproj" /p:PackageVersion=${{ steps.get_version.outputs.VERSION }} --output Nugets
        dotnet nuget push Nugets/TransactionProcessing.Shared.IntegrationTesting.${{ steps.get_version.outputs.VERSION }}.nupkg --api-key ${{ secrets.PRIVATEFEED_APIKEY }} --source ${{ secrets.PRIVATEFEED_URL }}

        dotnet pack "Shared.Results\Shared.Results.csproj" /p:PackageVersion=${{ steps.get_version.outputs.VERSION }} --output Nugets
        dotnet nuget push Nugets/Shared.Results.${{ steps.get_version.outputs.VERSION }}.nupkg --api-key ${{ secrets.PRIVATEFEED_APIKEY }} --source ${{ secrets.PRIVATEFEED_URL }}

        dotnet pack "Shared.Results.Web\Shared.Results.Web.csproj" /p:PackageVersion=${{ steps.get_version.outputs.VERSION }} --output Nugets
        dotnet nuget push Nugets/Shared.Results.Web.${{ steps.get_version.outputs.VERSION }}.nupkg --api-key ${{ secrets.PRIVATEFEED_APIKEY }} --source ${{ secrets.PRIVATEFEED_URL }}

        dotnet pack "TransactionProcessing.ApiDefaults\TransactionProcessing.ApiDefaults.csproj" /p:PackageVersion=${{ steps.get_version.outputs.VERSION }} --output Nugets
        dotnet nuget push Nugets/TransactionProcessing.ApiDefaults.${{ steps.get_version.outputs.VERSION }}.nupkg --api-key ${{ secrets.PRIVATEFEED_APIKEY }} --source ${{ secrets.PRIVATEFEED_URL }}

  create-shared-issue:
    needs: build
    uses: TransactionProcessing/org-ci-workflows/.github/workflows/reusable-create-shared-issue.yml@main
    with:
      issue-title: "Update Shared Nugets"
      issue-body: "Version Number ${{ needs.build.outputs.version }} is now available"
      target-repos: "TransactionProcessing/FileProcessor TransactionProcessing/EstateManagementUI TransactionProcessing/CallbackHandler TransactionProcessing/EstateReportingAPI TransactionProcessing/TransactionProcessor TransactionProcessing/SecurityService TransactionProcessing/Messaging TransactionProcessing/TransactionProcessorACL TransactionProcessing/MobileConfiguration TransactionProcessing/TestHosts TransactionProcessing/FileFormatConversion TransactionProcessing/SupportTools TransactionProcessing/TransactionMobile"
      project-org: "TransactionProcessing"
    secrets:
      gh_token: ${{ secrets.GH_TOKEN }}        

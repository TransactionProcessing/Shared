name: Nightly Build


on:
  schedule:
  - cron: "20 23 * * *"
  repository_dispatch:

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

jobs:
  buildandunittests:
    name: "Nightly Build - Main"
    env:
        ASPNETCORE_ENVIRONMENT: "Production"

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v1

    - name: Install NET 9
      uses: actions/setup-dotnet@v4.0.1
      with:
        dotnet-version: '9.0.x'

    - name: Restore Nuget Packages
      run: dotnet restore Shared.sln --source ${{ secrets.PUBLICFEEDURL }} --source ${{ secrets.PRIVATEFEED_URL }}

    - name: Build Code
      run: dotnet build Shared.sln --configuration Release


    - name: Notify on nightly failure
      if: ${{ failure() }}
      uses: TransactionProcessing/org-ci-workflows/.github/actions/nightly-failure-issue@main
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        title: Investigate Nightly Build Failure
        labels: nightlybuild
        dedupe_key: nightlybuild
        body: |
          Repo: ${{ github.repository }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Commit: ${{ github.sha }}
          Workflow: ${{ github.workflow }}
          Job: ${{ github.job }}

  buildlinux:
    name: "Nightly Build - Linux"
    env:
        ASPNETCORE_ENVIRONMENT: "Production"

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v1

    - name: Install NET 9
      uses: actions/setup-dotnet@v4.0.1
      with:
        dotnet-version: '9.0.x'

    - name: Restore Nuget Packages
      run: dotnet restore Shared.sln --source ${{ secrets.PUBLICFEEDURL }} --source ${{ secrets.PRIVATEFEED_URL }}

    - name: Build Code
      run: dotnet build Shared.sln --configuration Release

    - name: Trust root certificate
      run: |
        sudo cp ./Shared.EventStoreContext.Tests/certs/ca/ca.crt /usr/local/share/ca-certificates/ca.crt
        sudo update-ca-certificates

    - name: Run Event Store Tests
      run: |
        echo "ASPNETCORE_ENVIRONMENT are > ${ASPNETCORE_ENVIRONMENT}"        
        dotnet test "Shared.EventStoreContext.Tests\Shared.EventStoreContext.Tests.csproj"


    - name: Notify on nightly failure
      if: ${{ failure() }}
      uses: TransactionProcessing/org-ci-workflows/.github/actions/nightly-failure-issue@main
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        title: Investigate Nightly Build Failure
        labels: nightlybuild
        dedupe_key: nightlybuild
        body: |
          Repo: ${{ github.repository }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Commit: ${{ github.sha }}
          Workflow: ${{ github.workflow }}
          Job: ${{ github.job }}

    - uses: actions/upload-artifact@v4.4.3
      with:
        name: tracelogslinux
        path: /home/runner/trace/   

name: Nightly Build


on:
  schedule:
  - cron: "20 23 * * *"
  repository_dispatch:

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

jobs:
  buildlinux:
    name: "Nightly Build"
    env:
        ASPNETCORE_ENVIRONMENT: "Production"

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v1
    
    - name: Install .NET 11 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 11.0.x

    - name: Restore Nuget Packages
      run: dotnet restore TransactionProcessing.sln --source ${{ secrets.PUBLICFEEDURL }} --source ${{ secrets.PRIVATEFEED_URL }}

    - name: Build Code
      run: dotnet build TransactionProcessing.sln --configuration Release

    - name: Trust root certificate
      run: |
        sudo cp ./TransactionProcessing.Shared.EventStoreContext.Tests/certs/ca/ca.crt /usr/local/share/ca-certificates/ca.crt
        sudo update-ca-certificates

    - name: Run Unit Tests
      run: |
        echo "ASPNETCORE_ENVIRONMENT are > ${ASPNETCORE_ENVIRONMENT}"
        dotnet test "TransactionProcessing.Shared.Tests/TransactionProcessing.Shared.Tests.csproj"

    - name: Run Event Store Tests
      run: |
        echo "ASPNETCORE_ENVIRONMENT are > ${ASPNETCORE_ENVIRONMENT}"
        dotnet test "TransactionProcessing.Shared.EventStore.Tests/TransactionProcessing.Shared.EventStore.Tests.csproj"
        dotnet test "TransactionProcessing.Shared.EventStoreContext.Tests/TransactionProcessing.Shared.EventStoreContext.Tests.csproj"

    - name: Run Integration Tests
      run: |
        echo "ASPNETCORE_ENVIRONMENT are > ${ASPNETCORE_ENVIRONMENT}"
        dotnet test "TransactionProcessing.Shared.IntegrationTesting.Tests/TransactionProcessing.Shared.IntegrationTesting.Tests.csproj"

    - uses: actions/upload-artifact@v4.4.3
      with:
        name: tracelogslinux
        path: /home/runner/trace/
      
    - name: Notify on nightly failure
      if: ${{ failure() }}
      uses: TransactionProcessing/org-ci-workflows/.github/actions/nightly-failure-issue@main
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        title: Investigate Nightly Build Failure - Linux
        labels: nightlybuild
        dedupe_key: nightlybuild
        body: |
          Repo: ${{ github.repository }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Commit: ${{ github.sha }}
          Workflow: ${{ github.workflow }}
          Job: ${{ github.job }}
